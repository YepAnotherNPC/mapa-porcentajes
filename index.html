<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa con porcentajes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Mapbox -->
<link
href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css"
rel="stylesheet"
/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>

<style>

body {
  margin: 0;
  padding: 0;
}

#map {
  width: 100%;
  height: 100vh;
}

/* mejorar contraste del mapa */
#map canvas {
  filter: contrast(1.15) brightness(0.95);
}

/* marcador */
.marker {
  width: 25px;
  height: 25px;
  border-radius: 30%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 11px;
  color: #000;

  border: 2px solid black;

  text-shadow:
    0 0 2px white,
    0 0 4px white;

  cursor: pointer;
  user-select: none;

  filter: saturate(180%) contrast(1.1);
}

.mapboxgl-popup-content {
  text-align: center;
  font-family: Arial, sans-serif;
}

</style>
</head>

<body>

<div id="map"></div>

<script>

/* TOKEN MAPBOX */
mapboxgl.accessToken =
'pk.eyJ1IjoiZW1vcmVub2QiLCJhIjoiY21sNW9uZjdlMDRwazNkb2FzYXRibHhrbSJ9.Hod4AyKzJZmGdJyEL-7LOg';

/* URL GOOGLE SHEETS */
const SHEET_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUdfpCVAWZcpeZRvZTsFCDK1vt3laquSH5fjirJv9_rAXAF1UDycHyUlbj43ZVPJYTBBFpNCKw_mAz/pub?gid=0&single=true&output=csv';

/* COLOR PROGRESIVO */
function getGradientColor(percent) {

percent = Math.max(0, Math.min(100, percent));

if (percent <= 50) {

  const ratio = percent / 50;
  const r = 255;
  const g = Math.round(50 + 205 * ratio);

  return `rgb(${r}, ${g}, 0)`;

} else {

  const ratio = (percent - 50) / 50;
  const r = Math.round(255 * (1 - ratio));
  const g = 255;

  return `rgb(${r}, ${g}, 0)`;

}

}

/* PARSE CSV */
function parseCSV(text) {

const lines = text.trim().split('\n');
const separator = lines[0].includes(';') ? ';' : ',';
const headers = lines.shift().split(separator);

return lines.map(line => {

  const values = line.split(separator);
  const obj = {};

  headers.forEach((h, i) => {
    obj[h.trim()] = values[i]?.trim();
  });

  return obj;

});

}

/* distancia simple */
function distance(a, b) {

const dx = a.lng - b.lng;
const dy = a.lat - b.lat;

return Math.sqrt(dx * dx + dy * dy);

}

/* separar puntos cercanos */
function spreadPoints(points, threshold = 0.0003, radius = 0.0002) {

const groups = [];

points.forEach(p => {

  let group = groups.find(g =>
    distance({lng: p.lng, lat: p.lat}, g.center) < threshold
  );

  if (!group) {

    group = {
      center: { lng: p.lng, lat: p.lat },
      points: []
    };

    groups.push(group);

  }

  group.points.push(p);

});

groups.forEach(group => {

  if (group.points.length === 1) return;

  const step = (Math.PI * 2) / group.points.length;

  group.points.forEach((p, i) => {

    const angle = step * i;

    p.lng += Math.cos(angle) * radius;
    p.lat += Math.sin(angle) * radius;

  });

});

}

/* CREAR MAPA */
const map = new mapboxgl.Map({

container: 'map',

style: 'mapbox://styles/mapbox/light-v11',

center: [-70.64, -33.45],

zoom: 13

});

/* mejorar nombres y calles */
map.on('load', () => {

const layers = map.getStyle().layers;

layers.forEach(layer => {

  if (layer.type === "symbol") {

    if (layer.layout && layer.layout["text-field"]) {

      map.setPaintProperty(layer.id, "text-halo-color", "#ffffff");
      map.setPaintProperty(layer.id, "text-halo-width", 1.5);

    }

  }

  if (layer.id.includes("road") && layer.type === "line") {

    map.setPaintProperty(layer.id, "line-width", 1.4);

  }

});

});

/* CARGAR DATOS */
fetch(SHEET_URL)

.then(res => res.text())

.then(csv => {

const data = parseCSV(csv).map(p => ({
  ...p,
  lat: Number(p.lat),
  lng: Number(p.lng),
  percent: Number(p.percent)
}));

/* separar puntos cercanos */
spreadPoints(data);

const bounds = new mapboxgl.LngLatBounds();

data.forEach(p => {

  if (isNaN(p.percent) || isNaN(p.lat) || isNaN(p.lng)) return;

  const color = getGradientColor(p.percent);

  const el = document.createElement('div');

  el.className = 'marker';
  el.textContent = p.percent + '%';

  el.style.backgroundColor = color;

  el.style.boxShadow = `
    0 0 6px ${color},
    0 0 12px ${color},
    0 0 20px ${color}
  `;

  new mapboxgl.Marker(el)

    .setLngLat([p.lng, p.lat])

    .setPopup(
      new mapboxgl.Popup({ offset: 25 }).setHTML(
        `<h3>${p.name}</h3><b>${p.percent}%</b>`
      )
    )

    .addTo(map);

  bounds.extend([p.lng, p.lat]);

});

map.fitBounds(bounds, {
  padding: 40,
  maxZoom: 14
});

})

.catch(err => {
console.error('Error cargando CSV:', err);
});

</script>

</body>
</html>
